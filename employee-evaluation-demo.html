<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>เดโม: ระบบประเมินผลการทำงานพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#eef1f4; --surface:#ffffff; --ink:#1a2433; --muted:#66748a; --line:#d9dfe7;
  --accent:#1f5f8b; --accent-ink:#ffffff; --good:#2d7a4f; --warn:#b7791f; --bad:#b4423a;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171e; --surface:#1b222c; --ink:#e6ebf2; --muted:#92a0b4; --line:#2c3644;
  --accent:#5ea5d6; --accent-ink:#0d1620; --good:#5cc28a; --warn:#e0b050; --bad:#e2786f; color-scheme:dark;}
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.demo{background:var(--accent);color:var(--accent-ink);text-align:center;padding:6px 12px;font-size:.88rem}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"IBM Plex Sans Thai",system-ui,sans-serif;line-height:1.6}
header{background:var(--surface);border-bottom:1px solid var(--line);padding:14px 20px;display:flex;flex-wrap:wrap;gap:12px 28px;align-items:center}
header h1{font-size:1.1rem;margin:0;font-weight:600}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:none;border:0;color:var(--muted);font:inherit;padding:6px 14px;border-radius:6px;cursor:pointer}
nav button[aria-current="page"]{background:var(--accent);color:var(--accent-ink)}
nav button:hover:not([aria-current="page"]){color:var(--ink);background:var(--bg)}
main{max-width:1000px;margin:0 auto;padding:20px}
h2{font-size:1.15rem;margin:0 0 14px;font-weight:600}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:18px;margin-bottom:18px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:14px 16px}
.stat b{display:block;font-size:1.7rem;font-weight:600}
.stat span{color:var(--muted);font-size:.9rem}
.bars{display:grid;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(110px,200px) 1fr 56px;gap:10px;align-items:center;font-size:.92rem}
.bar{height:10px;background:var(--bg);border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.bar-row em{font-style:normal;text-align:right;font-variant-numeric:tabular-nums}
table{width:100%;border-collapse:collapse;font-size:.93rem}
th,td{padding:9px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:middle}
th{color:var(--muted);font-weight:500}
.tbl-wrap{overflow-x:auto}
form.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;align-items:end}
label{display:grid;gap:4px;font-size:.88rem;color:var(--muted)}
input,select,textarea{font:inherit;color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:8px 10px;width:100%}
input:focus-visible,select:focus-visible,textarea:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
button.btn{font:inherit;background:var(--accent);color:var(--accent-ink);border:0;border-radius:6px;padding:9px 16px;cursor:pointer;font-weight:500}
button.link{font:inherit;background:none;border:0;color:var(--accent);cursor:pointer;padding:2px 6px}
button.link.danger{color:var(--bad)}
.badge{display:inline-block;padding:1px 9px;border-radius:99px;font-size:.82rem;border:1px solid currentColor}
.g-top{color:var(--good)} .g-ok{color:var(--accent)} .g-mid{color:var(--warn)} .g-low{color:var(--bad)}
.crit{display:grid;grid-template-columns:minmax(130px,220px) 1fr 70px;gap:12px;align-items:center;padding:8px 0;border-bottom:1px solid var(--line)}
.crit input[type=range]{padding:0;accent-color:var(--accent)}
.crit output{text-align:right;font-variant-numeric:tabular-nums}
.total{display:flex;align-items:baseline;gap:12px;margin:16px 0}
.total b{font-size:2rem;font-weight:600}
.hist{border-top:1px solid var(--line);padding:14px 0}
.hist:first-child{border-top:0}
.hist-head{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;margin-bottom:6px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chips span{background:var(--bg);border-radius:6px;padding:2px 10px;font-size:.86rem}
.empty{color:var(--muted);padding:18px 0}
#toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:8px;opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (max-width:600px){.crit,.bar-row{grid-template-columns:1fr}.crit output,.bar-row em{text-align:left}}
@media (prefers-reduced-motion:reduce){#toast{transition:none}}
</style>
</head>
<body>
<header>
  <h1>ระบบประเมินผลการทำงานพนักงาน</h1>
  <nav id="nav">
    <button data-v="dash">ภาพรวม</button>
    <button data-v="emp">พนักงาน</button>
    <button data-v="eval">ประเมินผล</button>
    <button data-v="hist">ประวัติการประเมิน</button>
  </nav>
</header>
<div class="demo">โหมดสาธิต: ข้อมูลตัวอย่างอยู่ในหน้าเว็บนี้ ลองเพิ่ม/ประเมิน/ลบได้เลย รีเฟรชแล้วข้อมูลจะกลับเป็นค่าเริ่มต้น</div>
<main id="view"></main>
<div id="toast" role="status"></div>

<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const view = $("#view");
let employees = [], criteria = [], current = "dash", preselect = "";

const CR=[[1,'คุณภาพงาน',3],[2,'ปริมาณงาน/ความรวดเร็ว',2],[3,'การทำงานเป็นทีม',2],[4,'ความรับผิดชอบ',2],[5,'การพัฒนาตนเอง',1]].map(([id,name,weight])=>({id,name,weight,max_score:5}));
const EM=[['E001','สมชาย ใจดี','ขาย','ผู้จัดการฝ่ายขาย'],['E002','สุดา รักงาน','ขาย','เจ้าหน้าที่ขาย'],['E003','ปรีชา มั่นคง','ไอที','นักพัฒนาซอฟต์แวร์'],['E004','มาลี สดใส','ไอที','ผู้ดูแลระบบ'],['E005','วิชัย เก่งกล้า','บัญชี','นักบัญชี'],['E006','นภา ศรีสุข','บุคคล','เจ้าหน้าที่ HR'],['E007','อนุชา พัฒนา','การตลาด','นักการตลาดดิจิทัล'],['E008','ชนิดา งามตา','การตลาด','ผู้จัดการฝ่ายการตลาด']].map((r,i)=>({id:i+1,emp_code:r[0],name:r[1],department:r[2],position:r[3]}));
const DB={employees:EM,evaluations:[],nextEmp:9,nextEval:1};
function total(sc){let w=0,m=0;CR.forEach((c,i)=>{w+=sc[i]*c.weight;m+=5*c.weight});return Math.round(w/m*1000)/10}
function addEval(eid,period,evaluator,sc,comment){const e={id:DB.nextEval++,employee_id:eid,period,evaluator,comment,total_score:total(sc),scores:CR.map((c,i)=>({criteria_id:c.id,name:c.name,score:sc[i],max_score:5}))};DB.evaluations.push(e);return e}
(function seed(){const base=[4.5,3.5,4.2,3.8,3.0,4.0,0,4.7],cm=['ผลงานโดดเด่น ควรได้รับมอบหมายงานที่ท้าทายขึ้น','ทำงานได้ดี ควรพัฒนาทักษะการสื่อสารกับลูกค้า','ส่งงานตรงเวลาและมีคุณภาพสม่ำเสมอ','ต้องการคำแนะนำด้านการบริหารเวลา'];
['2026-07','2026-10'].forEach((p,pi)=>{EM.forEach(e=>{if(!base[e.id-1])return;const sc=CR.map((c,i)=>Math.min(5,Math.max(1,Math.round((base[e.id-1]+(((e.id*7+i*3+pi*5)%5)-2)*0.25+pi*0.2)*2)/2)));addEval(e.id,p,'คุณวรรณา (HR)',sc,cm[(e.id+pi)%4])})})})();
async function api(path,method='GET',body){
  const u=new URL(path,'http://x'),p=u.pathname;let m;
  if(p==='/employees'&&method==='GET')return DB.employees.map(e=>{const ev=DB.evaluations.filter(v=>v.employee_id===e.id),l=ev[ev.length-1];return {...e,latest_score:l?l.total_score:null,latest_period:l?l.period:null,eval_count:ev.length}}).sort((a,b)=>a.name.localeCompare(b.name,'th'));
  if(p==='/employees'&&method==='POST'){const code=String(body.emp_code||'').trim(),name=String(body.name||'').trim();if(!code||!name)throw new Error('กรุณากรอกรหัสและชื่อพนักงาน');if(DB.employees.some(e=>e.emp_code===code))throw new Error('รหัสพนักงานนี้มีอยู่แล้ว');DB.employees.push({id:DB.nextEmp++,emp_code:code,name,department:String(body.department||'').trim(),position:String(body.position||'').trim()});return {ok:true}}
  if((m=p.match(/^\/employees\/(\d+)$/))&&method==='DELETE'){const id=+m[1];DB.employees=DB.employees.filter(e=>e.id!==id);DB.evaluations=DB.evaluations.filter(v=>v.employee_id!==id);return {ok:true}}
  if(p==='/criteria')return CR;
  if(p==='/criteria-stats')return CR.map((c,i)=>{const s=DB.evaluations.map(v=>v.scores[i].score);return {id:c.id,name:c.name,n:s.length,pct:s.length?Math.round(s.reduce((a,b)=>a+b,0)/s.length/5*1000)/10:null}});
  if(p==='/evaluations'&&method==='GET'){const id=u.searchParams.get('employee_id');return DB.evaluations.filter(v=>!id||v.employee_id===+id).slice().reverse().map(v=>{const e=DB.employees.find(x=>x.id===v.employee_id);return {...v,employee_name:e.name,emp_code:e.emp_code}})}
  if(p==='/evaluations'&&method==='POST'){const eid=+body.employee_id;if(!eid||!body.period)throw new Error('กรุณาเลือกพนักงานและรอบการประเมิน');const sc=CR.map(c=>{const s=(body.scores||[]).find(x=>x.criteria_id===c.id);if(!s)throw new Error('กรุณาให้คะแนนให้ครบทุกหัวข้อ');return Math.min(5,Math.max(0,+s.score))});const e=addEval(eid,body.period,body.evaluator||'',sc,body.comment||'');return {id:e.id,total_score:e.total_score}}
  if((m=p.match(/^\/evaluations\/(\d+)$/))&&method==='DELETE'){DB.evaluations=DB.evaluations.filter(v=>v.id!==+m[1]);return {ok:true}}
  throw new Error('ไม่พบเส้นทางนี้');
}
function toast(msg) {
  const t = $("#toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600);
}
function grade(s) {
  if (s == null) return '<span class="empty">ยังไม่ประเมิน</span>';
  const [txt, cls] = s >= 90 ? ["ดีเยี่ยม", "g-top"] : s >= 75 ? ["ดี", "g-ok"] : s >= 60 ? ["พอใช้", "g-mid"] : ["ต้องปรับปรุง", "g-low"];
  return '<span class="badge ' + cls + '">' + txt + "</span>";
}
const fmt = (n) => (n == null ? "-" : Number(n).toFixed(1));
const empOptions = (sel) => employees.map((e) => '<option value="' + e.id + '"' + (String(e.id) === String(sel) ? " selected" : "") + ">" + esc(e.emp_code) + " · " + esc(e.name) + "</option>").join("");

async function load() {
  [employees, criteria] = await Promise.all([api("/employees"), api("/criteria")]);
}
function go(v) {
  current = v;
  document.querySelectorAll("#nav button").forEach((b) => { if (b.dataset.v === v) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  ({ dash: renderDash, emp: renderEmp, eval: renderEval, hist: renderHist })[v]();
}

async function renderDash() {
  const stats = await api("/criteria-stats");
  const done = employees.filter((e) => e.latest_score != null);
  const avg = done.length ? done.reduce((a, e) => a + e.latest_score, 0) / done.length : null;
  const depts = {};
  done.forEach((e) => { const d = e.department || "ไม่ระบุแผนก"; (depts[d] = depts[d] || []).push(e.latest_score); });
  const deptRows = Object.entries(depts).map(([d, a]) => [d, a.reduce((x, y) => x + y, 0) / a.length]).sort((a, b) => b[1] - a[1]);
  const bar = (label, v) => '<div class="bar-row"><span>' + esc(label) + '</span><div class="bar"><i style="width:' + (v || 0) + '%"></i></div><em>' + fmt(v) + "</em></div>";
  view.innerHTML =
    '<div class="stats">' +
    '<div class="stat"><b>' + employees.length + "</b><span>พนักงานทั้งหมด</span></div>" +
    '<div class="stat"><b>' + done.length + "</b><span>ได้รับการประเมินแล้ว</span></div>" +
    '<div class="stat"><b>' + fmt(avg) + "</b><span>คะแนนเฉลี่ยล่าสุด (เต็ม 100)</span></div></div>" +
    '<div class="panel"><h2>คะแนนเฉลี่ยตามแผนก</h2>' +
    (deptRows.length ? '<div class="bars">' + deptRows.map((r) => bar(r[0], r[1])).join("") + "</div>" : '<p class="empty">ยังไม่มีข้อมูลการประเมิน</p>') + "</div>" +
    '<div class="panel"><h2>คะแนนเฉลี่ยตามหัวข้อ (เป็นเปอร์เซ็นต์)</h2><div class="bars">' +
    stats.map((s) => bar(s.name, s.pct)).join("") + "</div></div>";
}

function renderEmp() {
  view.innerHTML =
    '<div class="panel"><h2>เพิ่มพนักงาน</h2><form id="f" class="grid">' +
    '<label>รหัสพนักงาน<input name="emp_code" required maxlength="30"></label>' +
    '<label>ชื่อ-นามสกุล<input name="name" required maxlength="100"></label>' +
    '<label>แผนก<input name="department" maxlength="100"></label>' +
    '<label>ตำแหน่ง<input name="position" maxlength="100"></label>' +
    '<button class="btn" type="submit">บันทึกพนักงาน</button></form></div>' +
    '<div class="panel"><h2>รายชื่อพนักงาน</h2>' +
    (employees.length
      ? '<div class="tbl-wrap"><table><thead><tr><th>รหัส</th><th>ชื่อ</th><th>แผนก</th><th>ตำแหน่ง</th><th>คะแนนล่าสุด</th><th></th></tr></thead><tbody>' +
        employees.map((e) =>
          "<tr><td>" + esc(e.emp_code) + "</td><td>" + esc(e.name) + "</td><td>" + esc(e.department) + "</td><td>" + esc(e.position) +
          "</td><td>" + (e.latest_score != null ? fmt(e.latest_score) + " " : "") + grade(e.latest_score) + "</td><td>" +
          '<button class="link" data-act="eval" data-id="' + e.id + '">ประเมิน</button>' +
          '<button class="link" data-act="hist" data-id="' + e.id + '">ประวัติ</button>' +
          '<button class="link danger" data-act="del" data-id="' + e.id + '">ลบ</button></td></tr>').join("") +
        "</tbody></table></div>"
      : '<p class="empty">ยังไม่มีพนักงาน เริ่มต้นด้วยการเพิ่มรายชื่อด้านบน</p>') + "</div>";

  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    try {
      await api("/employees", "POST", Object.fromEntries(new FormData(ev.target)));
      await load(); toast("บันทึกพนักงานแล้ว"); renderEmp();
    } catch (e) { toast(e.message); }
  };
  view.querySelectorAll("button[data-act]").forEach((b) => (b.onclick = async () => {
    const id = b.dataset.id;
    if (b.dataset.act === "eval") { preselect = id; go("eval"); }
    else if (b.dataset.act === "hist") { preselect = id; go("hist"); }
    else if (confirm("ลบพนักงานคนนี้และประวัติการประเมินทั้งหมดใช่หรือไม่?")) {
      try { await api("/employees/" + id, "DELETE"); await load(); toast("ลบพนักงานแล้ว"); renderEmp(); } catch (e) { toast(e.message); }
    }
  }));
}

function renderEval() {
  if (!employees.length) { view.innerHTML = '<div class="panel"><p class="empty">ต้องเพิ่มพนักงานก่อนจึงจะประเมินได้</p></div>'; return; }
  const month = new Date().toISOString().slice(0, 7);
  view.innerHTML =
    '<div class="panel"><h2>แบบประเมินผลการทำงาน</h2><form id="f">' +
    '<div class="grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px">' +
    '<label>พนักงาน<select name="employee_id" required>' + empOptions(preselect) + "</select></label>" +
    '<label>รอบการประเมิน<input type="month" name="period" value="' + month + '" required></label>' +
    '<label>ผู้ประเมิน<input name="evaluator" maxlength="100"></label></div>' +
    '<div style="margin-top:14px">' +
    criteria.map((c) =>
      '<div class="crit"><span>' + esc(c.name) + ' <small style="color:var(--muted)">(น้ำหนัก ' + c.weight + ")</small></span>" +
      '<input type="range" min="0" max="' + c.max_score + '" step="0.5" value="3" data-id="' + c.id + '" data-w="' + c.weight + '" data-max="' + c.max_score + '" aria-label="' + esc(c.name) + '">' +
      "<output>3 / " + c.max_score + "</output></div>").join("") +
    "</div>" +
    '<div class="total"><b id="total">-</b><span>คะแนนรวม (เต็ม 100)</span><span id="g"></span></div>' +
    '<label>ความเห็นเพิ่มเติม<textarea name="comment" rows="3" maxlength="1000"></textarea></label>' +
    '<p><button class="btn" type="submit">บันทึกผลการประเมิน</button></p></form></div>';

  const sliders = [...view.querySelectorAll("input[type=range]")];
  const calc = () => {
    let w = 0, m = 0;
    sliders.forEach((s) => {
      const v = Number(s.value), wt = Number(s.dataset.w), mx = Number(s.dataset.max);
      s.nextElementSibling.textContent = v + " / " + mx; w += v * wt; m += mx * wt;
    });
    const t = (w / m) * 100; $("#total").textContent = t.toFixed(1); $("#g").innerHTML = grade(t);
  };
  sliders.forEach((s) => s.addEventListener("input", calc)); calc();

  $("#f").onsubmit = async (ev) => {
    ev.preventDefault();
    const fd = Object.fromEntries(new FormData(ev.target));
    fd.scores = sliders.map((s) => ({ criteria_id: Number(s.dataset.id), score: Number(s.value) }));
    try {
      const r = await api("/evaluations", "POST", fd);
      await load(); preselect = fd.employee_id; toast("บันทึกแล้ว คะแนนรวม " + r.total_score); go("hist");
    } catch (e) { toast(e.message); }
  };
}

async function renderHist() {
  view.innerHTML =
    '<div class="panel"><h2>ประวัติการประเมิน</h2>' +
    '<label style="max-width:360px">เลือกพนักงาน<select id="sel"><option value="">ทุกคน</option>' + empOptions(preselect) + "</select></label>" +
    '<div id="list"></div></div>';
  const show = async () => {
    const id = $("#sel").value; preselect = id;
    const rows = await api("/evaluations" + (id ? "?employee_id=" + id : ""));
    $("#list").innerHTML = rows.length
      ? rows.map((r) =>
          '<div class="hist"><div class="hist-head"><strong>' + esc(r.employee_name) + "</strong><span>รอบ " + esc(r.period) +
          "</span><span>" + fmt(r.total_score) + " " + grade(r.total_score) + "</span><span style='color:var(--muted)'>ผู้ประเมิน: " + esc(r.evaluator || "-") +
          '</span><button class="link danger" data-del="' + r.id + '">ลบ</button></div><div class="chips">' +
          (r.scores || []).map((s) => "<span>" + esc(s.name) + " " + s.score + "/" + s.max_score + "</span>").join("") +
          "</div>" + (r.comment ? "<div>" + esc(r.comment) + "</div>" : "") + "</div>").join("")
      : '<p class="empty">ยังไม่มีประวัติการประเมิน</p>';
    $("#list").querySelectorAll("[data-del]").forEach((b) => (b.onclick = async () => {
      if (!confirm("ลบผลการประเมินนี้ใช่หรือไม่?")) return;
      try { await api("/evaluations/" + b.dataset.del, "DELETE"); await load(); toast("ลบแล้ว"); show(); } catch (e) { toast(e.message); }
    }));
  };
  $("#sel").onchange = show; show();
}

document.querySelectorAll("#nav button").forEach((b) => (b.onclick = () => { preselect = ""; go(b.dataset.v); }));
load().then(() => go("dash")).catch((e) => { view.innerHTML = '<div class="panel"><p>โหลดข้อมูลไม่สำเร็จ: ' + esc(e.message) + "</p></div>"; });
</script>
</body>
</html>
